<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FAB 실험실</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body>
<header><a href="/">FAB 실험실</a><span id="engine"></span><span id="endpoint"></span></header>
<div class="layout">
<aside><h2>실험 목록</h2><nav aria-label="세부 데모" id="scenarios"></nav></aside>
<main>
<h1 id="title">데모를 불러오는 중</h1>
<p id="question" class="lede"></p>
<p class="fixture">반도체 합성 검사 데이터 · FAB-DEMO-r3</p>
<form id="form">
<label for="prompt">모델에 보낼 요청</label>
<textarea id="prompt" required maxlength="6000" rows="2"></textarea>
<label id="sessionRow" hidden>대화 저장 키 <input id="session" value="seminar" maxlength="64"></label>
<div class="actions"><button id="run" type="submit">실행</button><span id="status" role="status"></span></div>
</form>
<section id="approval" hidden aria-labelledby="approval-title">
<h2 id="approval-title">승인 요청</h2><p id="approval-text"></p>
<button id="allow">이번 요청만 승인</button> <button id="deny">거절</button>
</section>
<section class="flow-board" aria-labelledby="flow-title">
<h2 id="flow-title">실행 흐름</h2>
<p class="meta" id="flow-note">화살표는 대표 경로입니다. 단계를 선택하면 실제 실행에서 관측한 값을 볼 수 있습니다.</p>
<div id="timeline" class="timeline" hidden>
<label for="timeline-select">실제 기록 순서</label>
<button type="button" id="event-prev" aria-label="이전 관측 이벤트">이전</button>
<select id="timeline-select"></select>
<button type="button" id="event-next" aria-label="다음 관측 이벤트">다음</button>
<button type="button" id="follow" aria-pressed="true">최신 실행 따라가기</button>
<p class="meta">기록을 선택하면 해당 시점의 값을 봅니다. 병렬 실행의 기록 순서는 작업의 의존 관계와 다를 수 있습니다.</p>
</div>
<div class="workspace" id="workspace">
<ol id="flow" aria-label="대표 실행 경로"></ol>
<div id="observation"></div>
</div>
</section>
<section id="outcome" hidden aria-labelledby="outcome-title">
<h2 id="outcome-title">실행 결과</h2><p id="outcome-text" class="answer"></p>
</section>
<details class="trace">
<summary>원본 실행 기록</summary>
<label><input type="checkbox" id="all"> 전체 이벤트</label>
<ol id="events"></ol>
</details>
</main></div></body></html>
