<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FAB 실험실</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body>
<header><a href="/">FAB 실험실</a><span id="engine"></span><span id="endpoint"></span></header>
<div class="layout">
<nav aria-label="세부 데모" id="scenarios"></nav>
<main>
<p class="fixture">합성 검사 데이터 · FAB-DEMO-r3</p>
<h1 id="title">데모를 불러오는 중</h1>
<form id="form">
<label for="prompt">모델에 보낼 요청</label>
<textarea id="prompt" required maxlength="6000" rows="3"></textarea>
<label id="sessionRow" hidden>대화 저장 키 <input id="session" value="seminar" maxlength="64"></label>
<div class="actions"><button id="run" type="submit">실제 요청 실행</button><span id="status" role="status"></span></div>
</form>
<section id="approval" hidden aria-labelledby="approval-title">
<h2 id="approval-title">승인 요청</h2><p id="approval-text"></p>
<button id="allow">이번 요청만 승인</button> <button id="deny">거절</button>
</section>
<section aria-labelledby="trace-title">
<div class="trace-heading"><h2 id="trace-title">실행 기록</h2><label><input type="checkbox" id="all"> 전체 이벤트</label></div>
<p id="overview" class="fixture" hidden></p>
<p id="empty">실행하면 실제 모델 요청, 함수 호출, 결과가 여기에 표시됩니다.</p>
<ol id="events"></ol>
</section>
</main></div></body></html>
