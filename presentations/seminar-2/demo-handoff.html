<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>실제 Demo 연결 안내</title><style>
:root{color-scheme:dark}body{margin:0;background:#243142;color:#F1F5FC;font:18px/1.8 sans-serif}main{max-width:880px;margin:70px auto;padding:0 28px}h1{font-size:38px;line-height:1.5}h2{font-size:24px;margin-top:40px}p,li{color:#B8C6D8}a{color:#9CC4FF}code{color:#E9C38F}.status{border-left:3px solid #E9C38F;padding-left:20px}.return{display:inline-block;margin-top:25px;border:1px solid #BCC7F3;padding:9px 20px;border-radius:6px;text-decoration:none;color:#F1F5FC}a:focus-visible{outline:3px solid #9CC4FF}</style></head><body><main><p>Agent Framework 세미나 · 별도 실행 관찰</p><h1 id="title">실제 Demo 연결 안내</h1><p class="status">실행 중인 로컬 데모에서 해당 시나리오를 엽니다.</p>
<p><a class="return" id="launch" target="_blank" rel="noopener">시나리오 열기</a></p>
<p>처음 실행할 때는 <a href="../../demos/README.md">설치 및 시작 안내</a>를 확인하세요.</p>
<p id="ports"></p><a class="return" href="index.html" id="return">발표자료로 돌아가기</a></main><script>
const query = new URLSearchParams(location.search);
const hermes = query.get('demo') !== 'pydanticai';
const port = hermes ? 18000 : 18001;
const modelPort = hermes ? 10000 : 10001;
const scenario = query.get('scenario') || (hermes ? 'loop' : 'graph');
const returnId = query.get('return') || (hermes ? 'S15' : 'PA52');
document.querySelector('#title').textContent = hermes ? 'Hermes Demo' : 'PydanticAI Demo';
document.querySelector('#launch').href = 'http://127.0.0.1:' + port + '/#' + encodeURIComponent(scenario);
document.querySelector('#ports').textContent = '웹 포트 ' + port + ' · 모델 포트 ' + modelPort;
document.querySelector('#return').href = 'index.html#' + encodeURIComponent(returnId);
</script></body></html>
